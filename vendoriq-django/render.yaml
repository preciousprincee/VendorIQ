services:
  - type: redis
    name: vendoriq-redis
    plan: starter
    ipAllowList: [] # only reachable from other services in this Render account/private network
    maxmemoryPolicy: allkeys-lru # cache data only - fine to evict the oldest entries under memory pressure

  - type: web
    name: vendoriq-api
    runtime: python
    plan: starter # bump to Standard/Pro as real traffic arrives - more CPU = more gunicorn workers
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py migrate --no-input &&
      python manage.py collectstatic --no-input
    # --workers: gthread workers each handle several requests concurrently via
    #   threads, so one slow request (an AI call, an email send) doesn't block
    #   every other request on that worker the way a plain sync worker would.
    # --timeout 60: gives the Groq AI call and outbound email room to finish
    #   instead of gunicorn killing the worker mid-request.
    # --max-requests: recycles each worker after it's handled ~1000 requests
    #   (±200 jitter, so they don't all restart in the same second). This is
    #   a safety net against slow per-process memory growth ever compounding
    #   into an OOM kill over a long sustained-traffic day - a fresh worker
    #   process every so often costs nothing under normal load and bounds
    #   the worst case.
    startCommand: >
      gunicorn vendoriq.wsgi:application
      --workers ${WEB_CONCURRENCY:-3}
      --worker-class gthread
      --threads ${GUNICORN_THREADS:-4}
      --timeout 60
      --max-requests 1000
      --max-requests-jitter 200
      --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false # paste the SAME long random value into vendoriq-api AND vendoriq-celery-worker (JWT/OTP signing must agree across both)
      - key: ALLOWED_HOSTS
        value: vendoriq-api.onrender.com
      - key: DATABASE_URL
        sync: false # Neon POOLED connection string (host contains "-pooler"), ending ?sslmode=require&channel_binding=require
      - key: DATABASE_URL_DIRECT
        sync: false # Neon DIRECT connection string (no "-pooler"). Used only by `manage.py migrate` in the build step
      - key: R2_ACCOUNT_ID
        sync: false # Cloudflare dashboard > R2 > overview: the 32-character Account ID
      - key: R2_BUCKET
        sync: false # the R2 bucket that holds product photos
      - key: R2_ACCESS_KEY_ID
        sync: false # R2 > Manage API tokens > create a token with Object Read & Write on THIS bucket
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false # public address of the bucket: a custom domain connected to it, e.g. photos.yourdomain.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      - key: AUTH_ALLOW_BODY_REFRESH
        value: "True" # lets sessions created before cookies were introduced migrate once; set to False 30 days after deploying
      - key: FRONTEND_URL
        value: https://your-app.vercel.app # used for links/logo in emails - keep identical on the worker below
      - key: NUM_PROXIES
        value: "2" # Vercel proxies /api to this server, so there are TWO proxies in front (Vercel, then Render). With 1, every visitor would share Vercel's IP and one rate-limit bucket. Use "1" only if the web app calls this API directly.
      - key: PAYSTACK_SECRET_KEY
        sync: false # payments (checkout verify, webhooks, referral payouts) return 503 without this
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: TERMII_API_KEY
        sync: false # SMS provider for phone verification codes - without it signup verification shows "temporarily unavailable"
      - key: TERMII_SENDER_ID
        value: N-Alert # must be an approved sender ID on your Termii account
      - key: TERMII_BASE_URL
        value: https://api.ng.termii.com # use the base URL shown on YOUR Termii dashboard if it differs
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false # resend.com > API Keys (starts with re_). "Sending access" is enough; the app refuses to start without it
      - key: DEFAULT_FROM_EMAIL
        sync: false # a sender on a domain VERIFIED in Resend (resend.com/domains), e.g. VendorIQ <no-reply@yourdomain.com>
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false # optional - leave unset to just not offer Google sign-in
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false # optional - leave unset to just not use error monitoring
      - key: POSTHOG_API_KEY
        sync: false # optional - PostHog project key (phc_...), same as the frontend's VITE_POSTHOG_KEY. Server-side sign-up/verification/trial/purchase events; unset = off
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com # EU project: https://eu.i.posthog.com
      # Shared cache across every gunicorn worker/dyno - this is what lets
      # DashboardView/TrendView/ProfitabilityView/NotificationsView stay cheap
      # under thousands of concurrent users instead of each request
      # recomputing the same aggregation from Postgres. If this service is
      # ever unreachable, django-redis (IGNORE_EXCEPTIONS=True, see
      # settings.py) makes the app fall back to querying the DB directly
      # rather than erroring out.
      - key: REDIS_URL
        fromService:
          type: redis
          name: vendoriq-redis
          property: connectionString

  # Runs background jobs (currently: invoice emails) so a slow/unreachable
  # email provider costs worker time here, not a web request thread. Without
  # REDIS_URL set, CELERY_TASK_ALWAYS_EAGER makes tasks run inline in the web
  # service instead (see settings.py) - so this service only matters once
  # REDIS_URL is actually wired up, which it is below.
  - type: worker
    name: vendoriq-celery-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # --concurrency 2: two worker threads is plenty for occasional invoice
    #   emails; bump this (or switch to --pool prefork with more processes)
    #   if background task volume grows meaningfully.
    # --without-heartbeat/--without-gossip/--without-mingle: this app has a
    #   single worker instance, so the usual multi-worker coordination
    #   features are pure overhead - trims idle Redis chatter.
    startCommand: >
      celery -A vendoriq worker
      --loglevel=info
      --concurrency=2
      --without-heartbeat
      --without-gossip
      --without-mingle
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false # paste the SAME long random value into vendoriq-api AND vendoriq-celery-worker (JWT/OTP signing must agree across both)
      - key: DATABASE_URL
        sync: false # same Neon POOLED string as vendoriq-api
      - key: R2_ACCOUNT_ID
        sync: false # same value as vendoriq-api (settings refuse to start in production without the R2 variables)
      - key: R2_BUCKET
        sync: false # the R2 bucket that holds product photos
      - key: R2_ACCESS_KEY_ID
        sync: false # R2 > Manage API tokens > create a token with Object Read & Write on THIS bucket
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false # public address of the bucket: a custom domain connected to it, e.g. photos.yourdomain.com
      - key: FRONTEND_URL
        value: https://your-app.vercel.app # the worker renders invoice emails - without this the logo URL was empty/localhost
      - key: PAYSTACK_SECRET_KEY
        sync: false # referral payouts run from tasks/sweeps that may execute on the worker
      - key: TERMII_API_KEY
        sync: false # same key as vendoriq-api: the app refuses to start in live mode without it
      - key: GROQ_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false # resend.com > API Keys (starts with re_). "Sending access" is enough; the app refuses to start without it
      - key: DEFAULT_FROM_EMAIL
        sync: false # same as vendoriq-api
      - key: SENTRY_DSN
        sync: false # same DSN as vendoriq-api - catches background task failures (e.g. invoice emails) too, not just web request errors
      - key: POSTHOG_API_KEY
        sync: false # same key as vendoriq-api (purchases can be recorded from tasks that run on the worker)
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      - key: REDIS_URL
        fromService:
          type: redis
          name: vendoriq-redis
          property: connectionString
